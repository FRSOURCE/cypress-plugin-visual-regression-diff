packages:
  - 'packages/*'
  - 'apps/*'
  - 'examples/*'
allowBuilds:
  cypress: true
  esbuild: true
  ffmpeg-static: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - prettier@3.9.0
overrides:
  "@rollup/pluginutils@4.2.1>picomatch": "4.0.7"
patchedDependencies:
  rollup-plugin-typescript2@0.32.1: patches/rollup-plugin-typescript2@0.32.1.patch
