name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # the only job that saves the cache (fastest job, never on the critical path)
          save-cache: 'true'
      - run: pnpm lint:ci
      - run: pnpm format:ci

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter cypress-plugin-visual-regression-diff... build
      - name: Test e2e
        run: pnpm test:e2e:ci
      - name: Test component-testing
        run: pnpm test:ct:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test
          path: |
            examples/next/**/*.png
            examples/next/**/*.jpg
            examples/next/**/*.jpeg
            examples/next/cypress/screenshots/visual-regression-manifest.*.json

  test-integration-coverage:
    name: test-integration-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # the plugin resolves @frsource/visual-regression-manifest through its dist
      - run: pnpm --filter visual-regression-manifest build
      - name: Test integration (with coverage)
        run: pnpm test:integration:ci
      - name: Upload coverage to Qlty
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: ${{github.workspace}}/packages/*/coverage/lcov.info

  prepare-release:
    name: detect changes, bump package versions, generate changelog and commit it to main branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, test-integration-coverage]
    if: ${{ github.actor != 'dependabot[bot]' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          command: manifest
          default-branch: main
          monorepo-tags: true

  build-and-release:
    name: build and release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release]
    if: needs.prepare-release.outputs.releases_created
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Build packages to get cross-references working 🔧
        run: pnpm build
      - name: Release package
        run: pnpm publish -r
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
